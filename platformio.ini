[platformio]
src_dir = .

[env]
platform = ststm32
board = nucleo_f411re
framework = arduino


[env:l10_led_blink]
build_src_filter = -<*> +<l10/1.led_blink/>


[env:l10_gpio]
build_src_filter = -<*> +<l10/2.gpio/>

[env:l11_tft_oled]
build_src_filter = -<*> +<l11/tft_display_other/>
monitor_speed = 115200
lib_deps = olikraus/U8g2